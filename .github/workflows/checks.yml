# Runs the test suite on every pull request and every push to main.
# Make "tests" a required status check in the branch protection for main.
name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"  # oldest supported version (pyproject)
          cache: pip
          cache-dependency-path: pyproject.toml  # no requirements.txt in this repo
      - name: Install modeling dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[modeling]" pytest
      - name: Tests (unit, leakage, committed artifacts, pipeline smoke runs)
        run: PYTHONPATH=src python -m pytest tests -v
      - name: Tests left the working tree untouched
        run: git status --porcelain && test -z "$(git status --porcelain)"
